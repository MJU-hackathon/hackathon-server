spring:
  application:
    name: thingkerton

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  ai:
    google:
      genai:
        # 키가 없어도 서버는 뜨지만 AI 호출은 실패한다 (AI_CALL_FAILED)
        api-key: ${GEMINI_API_KEY:missing-gemini-api-key}
        chat:
          options:
            model: ${GEMINI_CHAT_MODEL:gemini-3.6-flash}
            temperature: 0.7
            # 생각 단계가 길면 퀘스트 생성이 수십 초 걸린다. 응답 속도를 위해 낮게 둔다 (minimal/low/medium/high)
            thinking-level: ${GEMINI_THINKING_LEVEL:low}
    model:
      # Spring AI 모델은 채팅만 사용. 임베딩·이미지 모델 빈은 만들지 않는다
      # (퀘스트 대표 이미지는 CloudflareImageClient가 Workers AI로 직접 생성)
      embedding:
        text: none
      image: none
    retry:
      # 재시도하지 않는다. 앱 타임아웃(10초) 안에 응답해야 하므로 실패하면 바로 데모·원문으로 대체한다
      # (Gemini SDK 자체 재시도는 AiConfig에서 끈다)
      max-attempts: 1
      backoff:
        initial-interval: 1s
        max-interval: 3s

app:
  cloudflare:
    ai:
      # Workers AI (퀘스트 대표 이미지). 무료 하루 10,000 neuron, flux-1-schnell 1장 약 173 neuron
      account-id: ${CLOUDFLARE_ACCOUNT_ID:}
      api-token: ${CLOUDFLARE_API_TOKEN:}
      image-model: ${CLOUDFLARE_IMAGE_MODEL:@cf/black-forest-labs/flux-1-schnell}
      steps: ${CLOUDFLARE_IMAGE_STEPS:4}
  dev:
    # 개발·QA용 초기화 API(DELETE /api/dev/daily-quests/today). 운영에서는 끈다
    reset-enabled: ${APP_DEV_RESET_ENABLED:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  s3:
    bucket: ${S3_BUCKET:mju-hackathon-photos-2026}
    region: ${S3_REGION:ap-southeast-2}
  quest:
    # 앱 타임아웃(10초) 안에 응답하도록 맞춘 제한 시간.
    # ensure 최악 응답 ≈ generation + max(geocoding, image-generation) + DB·네트워크(약 1초) ≈ 9초
    # 생성은 넘으면 데모 퀘스트로, 번역은 넘으면 원문으로 응답한다
    generation-timeout: ${QUEST_GENERATION_TIMEOUT:5s}
    translation-timeout: ${QUEST_TRANSLATION_TIMEOUT:6s}
    # 장소 주소 → 좌표 변환(네이버 Geocoding) 제한 시간. 이미지 생성과 동시에 실행. 넘으면 좌표 없이 저장한다
    geocoding-timeout: ${QUEST_GEOCODING_TIMEOUT:2s}
    # 대표 이미지 생성 제한 시간(Cloudflare, 3장 병렬, 좌표 변환과 동시에 실행). 넘으면 카테고리 기본 이미지로 저장한다
    image-generation-timeout: ${QUEST_IMAGE_GENERATION_TIMEOUT:3s}
    # 기본 대표 이미지(데모 퀘스트·AI 생성 실패 시). TODO: 팀이 준비한 이미지 경로로 교체 ({base-url}/{카테고리}.jpg)
    image-base-url: ${QUEST_IMAGE_BASE_URL:https://cdn.example.com/quest-images}
  naver-maps:
    api-key-id: ${NAVER_MAPS_API_KEY_ID}
    api-key: ${NAVER_MAPS_API_KEY}

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
