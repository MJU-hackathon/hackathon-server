spring:
  application:
    name: thingkerton

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  ai:
    google:
      genai:
        # 키가 없어도 서버는 뜨지만 AI 호출은 실패한다 (AI_CALL_FAILED)
        api-key: ${GEMINI_API_KEY:missing-gemini-api-key}
        chat:
          options:
            model: ${GEMINI_CHAT_MODEL:gemini-3.6-flash}
            temperature: 0.7
    model:
      # 채팅만 사용. 임베딩·이미지 생성 모델은 만들지 않는다
      embedding:
        text: none
      image: none
    retry:
      max-attempts: 2
      backoff:
        initial-interval: 1s
        max-interval: 3s

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  s3:
    bucket: ${S3_BUCKET:mju-hackathon-photos-2026}
    region: ${S3_REGION:ap-southeast-2}

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
