spring:
  datasource:
    url: jdbc:h2:mem:thingkerton;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  ai:
    google:
      genai:
        api-key: test-api-key

app:
  ai:
    image:
      model: test-image-model
  quest:
    generation-timeout: 1s
    translation-timeout: 1s
    geocoding-timeout: 1s
    image-generation-timeout: 1s
    # 로컬 .env(QUEST_IMAGE_BASE_URL)와 무관하게 고정
    image-base-url: https://cdn.example.com/quest-images
  naver-maps:
    api-key-id: test-id
    api-key: test-key
  s3:
    bucket: test-bucket
    region: ap-southeast-2
