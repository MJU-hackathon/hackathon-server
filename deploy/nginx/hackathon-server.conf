# 레포에서 관리하는 nginx 설정입니다. 서버에서 직접 수정하지 말고 이 파일을 수정하세요.
# main에 반영되면 .github/workflows/nginx.yml이 EC2 /etc/nginx/sites-available/hackathon-server에 적용합니다.
# "managed by Certbot" 줄은 인증서 발급 시 Certbot이 추가한 내용이므로 그대로 둡니다.

server {
    server_name soptinthingji.p-e.kr;
    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/soptinthingji.p-e.kr/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/soptinthingji.p-e.kr/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = soptinthingji.p-e.kr) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name soptinthingji.p-e.kr;
    return 404; # managed by Certbot


}